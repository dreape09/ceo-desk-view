<style>
:root{--bg:#FFF4E4;--card:#fff;--ink:#3A2E2B;--muted:#8D7C75;--line:#F1E3D3;--coral:#FF6F61;--sun:#FFB347;--pink:#FF8FAB;--mint:#3DBE9B;--lav:#6C7BEF;--shadow:0 6px 18px rgba(176,120,80,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.65 -apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:linear-gradient(180deg,#FFE8CC 0,var(--bg) 280px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.lock form{width:min(340px,100%);text-align:center}
.lock .av{width:120px;height:120px;margin:0 auto 10px}
.lock h1{margin:0;font-size:26px;letter-spacing:.08em;color:var(--coral)}
.lock p{color:var(--muted);font-size:14px;margin:4px 0 18px}
.lock input[type=password]{width:100%;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:17px;text-align:center}
.lock input:focus{outline:none;border-color:var(--sun)}
.lock label{display:block;margin:12px 0;font-size:13px;color:var(--muted)}
.btn-main{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
#err{color:var(--coral);min-height:22px;font-size:14px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;color:var(--muted);font-size:13px}
.top b{color:var(--ink);font-size:17px}
.gear{border:0;background:#fff;border-radius:50%;width:38px;height:38px;box-shadow:var(--shadow);font-size:18px}
.hero{display:flex;gap:12px;align-items:center;padding:14px;border-radius:24px;background:linear-gradient(135deg,#FFD9A8,#FFB6C8);box-shadow:var(--shadow)}
.hero .av{flex:none;width:88px;height:88px;border:0;background:none;padding:0}
.bubble{position:relative;flex:1;background:rgba(255,255,255,.92);border-radius:18px;padding:11px 14px;font-size:15.5px;line-height:1.6;min-height:78px}
.bubble:before{content:"";position:absolute;left:-7px;top:34px;width:14px;height:14px;background:rgba(255,255,255,.92);transform:rotate(45deg);border-radius:3px}
.bubble small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--coral)}
.stat span{font-size:12px;color:var(--muted)}
h2{font-size:17px;margin:24px 4px 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:8px;height:20px;border-radius:4px;background:linear-gradient(var(--sun),var(--coral))}
h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.card{background:var(--card);border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.task .t{font-weight:700;font-size:16.5px;line-height:1.5}
.task .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;font-size:12px;border-radius:99px;padding:1px 10px;background:#FFF0DC;color:#C2701B;margin-right:6px}
.badge.red{background:#FFE4E0;color:#D0443A}.badge.mint{background:#DDF6EE;color:#1E8F72}
.btns{display:flex;gap:8px;margin-top:12px}
.b{flex:1;border:0;border-radius:14px;padding:11px 6px;font-weight:700;font-size:15px}
.b.done{background:linear-gradient(135deg,#4DD6AE,var(--mint));color:#fff;flex:1.5}
.b.almost{background:#FFF0DC;color:#C2701B}
.b.later{background:#F3EEFF;color:#6757D6}
.b.b-sm{font-size:13px;padding:8px 4px;font-weight:600}
.b:active{transform:scale(.97)}
.dream h3{margin:0;font-size:17px;line-height:1.4}
.dream .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.pct{display:flex;align-items:baseline;gap:8px}
.pct b{font-size:38px;line-height:1;color:var(--c,var(--coral))}
.pct span{font-size:13px;color:var(--muted)}
.track{height:14px;border-radius:99px;background:#F6EADB;overflow:hidden;margin:10px 0}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c,#FFB347),var(--c2,#FF6F61));transition:width .6s}
.ms{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.ms li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.ms .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #E7D5C0;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.ms li.ok .dot{background:var(--mint);border-color:var(--mint)}
.ms li.now .dot{border-color:var(--sun);background:#FFF0DC}
.ms li.ok span{color:var(--muted);text-decoration:line-through}
.cheer{margin-top:10px;font-size:14px;color:#B0521A;background:#FFF3E3;border-radius:12px;padding:8px 12px}
.win{display:flex;gap:8px;padding:6px 2px;font-size:15px}.win:before{content:"✓";color:var(--mint);font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:6px 4px}
.proj .t{font-weight:700}
.lane{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
details summary{cursor:pointer;list-style:none;font-weight:700;padding:6px 4px}
details summary::-webkit-details-marker{display:none}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;font-size:32px;box-shadow:0 8px 22px rgba(255,111,97,.45);z-index:20}
.sheet{position:fixed;inset:0;background:rgba(58,46,43,.45);display:none;align-items:flex-end;z-index:30}
.sheet.open{display:flex}
.sheet .in{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px}
.sheet input[type=text],.sheet input[type=password]{width:100%;padding:13px;border:2px solid var(--line);border-radius:14px;font-size:16px;margin:6px 0 12px}
.sheet p{font-size:13px;color:var(--muted);margin:4px 0 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;max-width:92%;font-size:14.5px;z-index:40;box-shadow:var(--shadow);display:none;text-align:center}
.banner{background:#FFF3C9;border-radius:14px;padding:9px 13px;font-size:13px;margin:10px 0;color:#8A5A00}
.confetti{position:fixed;top:0;width:10px;height:14px;z-index:50;border-radius:2px;animation:fall 1.5s ease-out forwards;pointer-events:none}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.9}}
</style>

/* ---------- ロック解除（AES-CBC + HMAC。パスワードは端末内だけで使う） ---------- */
async function unlock(pw) {
  var en = new TextEncoder();
  var km = await crypto.subtle.importKey('raw', en.encode(pw), 'PBKDF2', false, ['deriveBits']);
  var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: ub(P.s), iterations: P.n, hash: 'SHA-256' }, km, 512));
  var encKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  var macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  var iv = ub(P.i), ct = ub(P.c), msg = new Uint8Array(iv.length + ct.length);
  msg.set(iv); msg.set(ct, iv.length);
  if (!(await crypto.subtle.verify('HMAC', macKey, ub(P.m), msg))) throw new Error('bad');
  var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, encKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

    e.preventDefault(); var pw = $('#pw').value, rm = $('#rm').checked;
    $('#err').textContent = '確認中…';
    unlock(pw).then(function (d) { lsSet('cdv2_pw', rm ? pw : null); start(d); }).catch(function () { $('#err').textContent = 'パスワードが違います'; });
  });
}

/* ---------- データと計算 ---------- */
var DATA = null, PEND = [];
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function savePend() { lsSet('cdv2_pend', JSON.stringify(PEND)); }
function applyOp(B, op) {
  var t = B.tasks.filter(function (x) { return x.id === op.id; })[0], p = B.projects.filter(function (x) { return x.id === op.id; })[0];
  if (op.cmd === 'add') { B.tasks.push({ id: 'new-' + op.opId, title: op.title, project: '', milestone: '', priority: 'medium', due: '', status: 'todo', doneAt: '' }); return; }
  if (t) {
    if (op.cmd === 'done') { t.status = 'done'; t.doneAt = new Date(op.ts).toISOString(); }
    else if (op.cmd === 'almost' && t.status !== 'done') t.status = 'almost';
    else if (op.cmd === 'tomorrow' && t.status !== 'done') t.due = addDays(1);
    else if (op.cmd === 'today' && t.status !== 'done') t.due = today();
  }
  if (p && op.cmd.indexOf('status-') === 0) p.lane = op.cmd.slice(7);
}
function effective() {
  var B = JSON.parse(JSON.stringify(DATA.board)), ap = DATA.applied || [];
  PEND.filter(function (o) { return ap.indexOf(o.opId) < 0; }).forEach(function (o) { applyOp(B, o); });
  return B;
}
function dreamPct(d, tasks) {
  var sum = 0;
  d.milestones.forEach(function (m) {
    var ts = tasks.filter(function (t) { return t.milestone === m.id; });
    sum += ts.length ? ts.reduce(function (a, t) { return a + (t.status === 'done' ? 1 : t.status === 'almost' ? 0.5 : 0); }, 0) / ts.length : (m.done ? 1 : 0);
  });
  return d.milestones.length ? Math.round(sum / d.milestones.length * 100) : 0;
}
function msState(m, tasks) {
  var ts = tasks.filter(function (t) { return t.milestone === m.id; });
  if (ts.length) { var dn = ts.filter(function (t) { return t.status === 'done'; }).length; return dn === ts.length ? 'ok' : (dn || ts.some(function (t) { return t.status === 'almost'; }) ? 'now' : ''); }
  return m.done ? 'ok' : '';
}
function dreamDelta(d, pct) {
  var h = DATA.history || [], base = null, lim = addDays(-7);
  for (var i = 0; i < h.length; i++) { if (h[i].date <= lim && h[i].d && h[i].d[d.id] != null) base = h[i].d[d.id]; }
  if (base === null && h.length && h[0].d && h[0].d[d.id] != null && h[0].date < today()) base = h[0].d[d.id];
  return base === null ? null : pct - base;
}
function pickToday(B) {
  var lane = {}; B.projects.forEach(function (p) { lane[p.id] = p.lane; });
  var td = today(), pri = { high: 30, medium: 15, low: 0 };
  return B.tasks.filter(function (t) { return t.status !== 'done' && !(t.due && t.due > td) && (lane[t.project] === 'now' || !t.project); }).map(function (t) {
    var s = (pri[t.priority] || 0) + (t.status === 'almost' ? 25 : 0) + 20;
    if (t.due && t.due < td) s += 60; else if (t.due === td) s += 45;
    return { t: t, s: s };
  }).sort(function (a, b) { return b.s - a.s; }).slice(0, 3).map(function (x) { return x.t; });
}
function weekStart() { var d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function doneThisWeek(B) {
  var ws = weekStart();
  return B.tasks.filter(function (t) { return t.status === 'done' && t.doneAt && t.doneAt.slice(0, 10) >= ws; }).sort(function (a, b) { return b.doneAt.localeCompare(a.doneAt); });
}

/* ---------- 秘書のひとこと ---------- */
var PUSH = ['迷う時間がもったいない！ 最初の1つ、今すぐいきましょう。', '5分だけやってみる。その5分が、未来を変えます。', '今日の一歩が、半年後のあなたをつくります。', 'いい流れ、来てます。止めずにそのまま行きましょう！', '完璧を待たなくていい。60点で出して、育てていきましょう。'];
var HOT = ['本気で取り組んでるあなたは、もう勝ち始めてます。', '悔しさも、迷いも、ぜんぶ燃料にして進みましょう！', 'あなたの本気に、私は全力で付き合います。', '止まらなければ、必ず届きます。信じて進みましょう！'];
var SOFT = ['ひとりで全部やろうとしなくて大丈夫。今日は3つだけ、私が見ています。', 'ここまで全部ひとりで回してきたこと、ちゃんと見ています。', 'できなかったことより、できたことを数えましょう。', '疲れている日は、目標を半分にしても大丈夫です。'];
function secLines(B) {
  var h = new Date().getHours(), call = (DATA.owner && DATA.owner.call) ? DATA.owner.call + 'さん、' : '';
  var greet = call + (h < 5 ? '夜遅くまでお疲れさまです。' : h < 11 ? 'おはようございます！' : h < 18 ? 'お疲れさまです！' : '今日も一日お疲れさまでした。');
  var td = pickToday(B), wk = doneThisWeek(B), M = DATA.metrics || {}, dayNo = Math.floor(Date.now() / 864e5), out = [], mo = [];
  function add(t, m) { out.push(t); mo.push(m || 'happy'); }
  if (td.length) add('今日の最初の1つは「' + td[0].title + '」。ここからいきましょう！', 'happy'); else add('今日の3つは、すべて終わっています。すごい！', 'cheer');
  if (wk.length) add('今週はもう' + wk.length + '件、やり切っています。ちゃんと前に進んでますよ。', 'cheer');
  if (M.streak >= 2) add('活動が' + M.streak + '日続いています。続けているあなたは、本当にすごい。', 'cheer');
  var d = B.dreams[dayNo % B.dreams.length], pc = dreamPct(d, B.tasks);
  add('「' + d.title + '」まで、いま' + pc + '％。一歩ずつ、ちゃんと近づいています。', 'cheer');
  add(PUSH[dayNo % PUSH.length], 'cheer'); add(HOT[dayNo % HOT.length], 'cheer'); add(SOFT[dayNo % SOFT.length], 'happy');
  return { greet: greet, lines: out, moods: mo };
}

/* ---------- 画面 ---------- */
var secIdx = 0;
function ago(iso) {
  var m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 2 ? 'たった今' : m < 90 ? m + '分前' : m < 2880 ? Math.round(m / 60) + '時間前' : Math.round(m / 1440) + '日前';
}
function taskCard(t, B) {
  var p = B.projects.filter(function (x) { return x.id === t.project; })[0], td = today(), over = t.due && t.due < td;
  return '<div class="card task"><div class="t">' + esc(t.title) + '</div><div class="m">' +
    (t.status === 'almost' ? '<span class="badge">あと少し！</span>' : '') + (over ? '<span class="badge red">期限切れ</span>' : t.due === td ? '<span class="badge red">今日まで</span>' : '') + (p ? esc(p.name) : '') + '</div>' +
    '<div class="btns"><button class="b done" data-op="done" data-id="' + esc(t.id) + '">完了！</button><button class="b almost" data-op="almost" data-id="' + esc(t.id) + '">あと少し</button><button class="b later" data-op="tomorrow" data-id="' + esc(t.id) + '">明日へ</button></div></div>';
}
function laneBtns(p) {
  var to = p.lane === 'now' ? [['wait', '待ち'], ['later', 'あとで']] : p.lane === 'wait' ? [['now', '進める'], ['later', 'あとで']] : [['now', '進める'], ['wait', '待ち']];
  return '<div class="lane">' + to.map(function (x) { return '<button class="b b-sm ' + (x[0] === 'now' ? 'done' : 'later') + '" data-op="status-' + x[0] + '" data-id="' + esc(p.id) + '">' + x[1] + (x[0] === 'now' ? 'にする' : 'にする') + '</button>'; }).join('') + '</div>';
}
function render() {
  if (!DATA) return;
  var B = effective(), M = DATA.metrics || {}, s = secLines(B), i = secIdx % s.lines.length, td = pickToday(B), wk = doneThisWeek(B);
  var sent = PEND.filter(function (o) { return (DATA.applied || []).indexOf(o.opId) < 0; }), unsent = sent.filter(function (o) { return !o.sent; }), hasTok = !!lsGet('cdv2_tok');
  var h = '<div class="wrap"><div class="top"><div><b>' + esc(new Date().getMonth() + 1) + '月' + new Date().getDate() + '日</b><br>更新 ' + esc(ago(DATA.generatedAt)) + '</div><button class="gear" data-act="settings" aria-label="設定">⚙</button></div>';
  if (!hasTok) h += '<div class="banner">ボタンの操作をMacに送るには、⚙ からトークンを1回だけ設定してください。</div>';
  else if (unsent.length) h += '<div class="banner">未送信の操作が' + unsent.length + '件あります。電波のよい場所で、画面を開き直すと送られます。</div>';
  h += '<div class="hero"><button class="av" data-act="next" aria-label="次のひとこと">' + avatar(s.moods[i]) + '</button><div class="bubble">' + esc((i === 0 ? s.greet + ' ' : '') + s.lines[i]) + '<small>イラストをタップで次のひとこと</small></div></div>';
  h += '<div class="stats"><div class="stat"><b>' + (M.streak || 0) + '</b><span>連続活動（日）</span></div><div class="stat"><b>' + wk.length + '</b><span>今週の完了</span></div><div class="stat"><b>' + ((M.postsMonth || 0)) + '</b><span>今月の投稿</span></div></div>';
  h += '<h2>今日の' + (td.length || 3) + 'つ<small>タップで進めよう</small></h2>' + (td.length ? td.map(function (t) { return taskCard(t, B); }).join('') : '<div class="card empty">今日の分は、すべて完了です。ゆっくり休んでください。</div>');
  h += '<h2>夢への道のり</h2>' + B.dreams.map(function (d) {
    var pc = dreamPct(d, B.tasks), dl = dreamDelta(d, pc);
    return '<div class="card dream" style="--c:' + esc(d.color || '#FF8A5B') + '"><h3>' + esc(d.title) + '</h3><div class="sub">' + esc(d.sub) + '</div><div class="pct"><b>' + pc + '<small style="font-size:20px">％</small></b><span>' + (dl === null ? '' : dl > 0 ? '先週より +' + dl + '％' : '今週のスタートは、ここから') + '</span></div>' +
      '<div class="track"><i style="width:' + pc + '%"></i></div><ul class="ms">' + d.milestones.map(function (m) { var st = msState(m, B.tasks); return '<li class="' + st + '"><div class="dot">' + (st === 'ok' ? '✓' : '') + '</div><span>' + esc(m.title) + '</span></li>'; }).join('') + '</ul>' +
      '<div class="cheer">' + (pc >= 100 ? '夢が、叶いました！ おめでとうございます！' : pc >= 60 ? '夢が、もう目の前です！' : pc >= 25 ? 'いい感じです。夢に、ちゃんと近づいています！' : 'ここからが始まり。1つ終えるたびに、夢へ近づきます。') + '</div></div>';
  }).join('');
  h += '<h2>今週のできたこと<small>' + wk.length + '件</small></h2>' + (wk.length ? '<div class="card">' + wk.slice(0, 8).map(function (t) { return '<div class="win">' + esc(t.title) + '</div>'; }).join('') + '</div>' : '<div class="card empty">まだありません。1つ終えると、ここに並びます。</div>');
  var now = B.projects.filter(function (p) { return p.lane === 'now'; }), wait = B.projects.filter(function (p) { return p.lane === 'wait'; }), later = B.projects.filter(function (p) { return p.lane === 'later'; });
  function pc(p) { return '<div class="card proj"><div class="t">' + esc(p.name) + '</div><div class="m" style="font-size:13px;color:var(--muted);margin-top:3px">' + esc(p.next) + '</div>' + laneBtns(p) + '</div>'; }
  h += '<h2>いま進めるのは3つまで<small>' + now.length + '件</small></h2>' + (now.length ? now.map(pc).join('') : '<div class="card empty">「待ち」から「進める」を選んでください。</div>');
  h += '<details class="card"><summary>待ち・あとで（' + (wait.length + later.length) + '件）</summary>' + wait.concat(later).map(function (p) { return '<div class="proj" style="padding:10px 0;border-top:1px solid var(--line)"><div class="t">' + esc(p.name) + '</div><span class="badge">' + (p.lane === 'wait' ? '待ち' : 'あとで') + '</span>' + laneBtns(p) + '</div>'; }).join('') + '</details>';
  h += '</div><button class="fab" data-act="add" aria-label="思いついた仕事を送る">＋</button>';
  h += '<div id="sheet-add" class="sheet"><div class="in"><h3>思いついた仕事を送る</h3><p>Macに届いて、タスクに入ります。</p><input id="newt" type="text" placeholder="例：看板の発注を確認する" maxlength="200"><button class="btn-main" data-act="send-add">送る</button></div></div>';
  h += '<div id="sheet-set" class="sheet"><div class="in"><h3>設定</h3><p>ボタンの操作をMacに送るための「トークン」を、この端末に1回だけ保存します（受信箱リポジトリのIssue書き込みだけを許可したもの）。</p><input id="tok" type="password" placeholder="github_pat_…" autocomplete="off"><button class="btn-main" data-act="save-tok">保存</button><p style="margin-top:14px">' + (hasTok ? 'トークンは保存済みです。' : 'まだ保存されていません。') + '　<button data-act="clear-tok" style="border:0;background:none;color:var(--coral);text-decoration:underline">削除</button></p><p><button data-act="lock" style="border:0;background:none;color:var(--muted);text-decoration:underline">ロックする（パスワード記憶を消す）</button></p></div></div>';
  $('#app').innerHTML = h;
}
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2800); }
function confetti() {
  var cols = ['#FF6F61', '#FFB347', '#FF8FAB', '#3DBE9B', '#6C7BEF'];
  for (var i = 0; i < 26; i++) { var c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length]; c.style.animationDelay = (Math.random() * .3) + 's'; document.body.appendChild(c); setTimeout(function (el) { el.remove(); }.bind(null, c), 2000); }
}

/* ---------- 操作の送信（GitHubの受信箱へ） ---------- */
function postOp(op) {
  var tok = lsGet('cdv2_tok'), inbox = (DATA.meta || {}).inbox;
  if (!tok || !inbox) return Promise.resolve(false);
  var titles = { done: '完了', almost: 'あと少し', tomorrow: '明日へ', today: '今日やる', add: '追加' };
  return fetch('https://api.github.com/repos/' + inbox + '/issues', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
    body: JSON.stringify({ title: op.cmd === 'add' ? op.title : (titles[op.cmd] || op.cmd) + '：' + (op.title || ''), body: 'ceo2:' + op.cmd + ':' + (op.id || '-') + ':' + op.opId })
  }).then(function (r) { if (r.ok) { op.sent = 1; savePend(); return true; } if (r.status === 401 || r.status === 403 || r.status === 404) toast('送れませんでした。⚙ のトークンを確認してください'); return false; }).catch(function () { return false; });
}
function flush() { PEND.filter(function (o) { return !o.sent; }).reduce(function (p, o) { return p.then(function () { return postOp(o); }); }, Promise.resolve()).then(render); }
function sendOp(cmd, id, title) {
  var op = { opId: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), cmd: cmd, id: id || '', title: title || '', ts: Date.now(), sent: 0 };
  var before = {}, B0 = effective(); B0.dreams.forEach(function (d) { before[d.id] = dreamPct(d, B0.tasks); });
  PEND.push(op); savePend();
  render();
  if (cmd === 'done') {
    var B = effective(), gain = 0, name = '';
    B.dreams.forEach(function (d) { var g = dreamPct(d, B.tasks) - (before[d.id] || 0); if (g > gain) { gain = g; name = d.title; } });
    confetti(); toast(gain > 0 ? 'ナイス！ 夢に +' + gain + '％ 近づきました' : 'ナイス！ 1つ完了です');
  } else if (cmd === 'almost') toast('あと少し！ 明日の最初に出しますね'); else if (cmd === 'tomorrow') toast('明日に回しました'); else if (cmd === 'add') toast('送りました'); else toast('移しました');
  postOp(op).then(render);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-op],[data-act]');
  if (!b) { if (e.target.classList && e.target.classList.contains('sheet')) e.target.classList.remove('open'); return; }
  if (b.dataset.op) {
    var B = effective(), t = B.tasks.filter(function (x) { return x.id === b.dataset.id; })[0] || B.projects.filter(function (x) { return x.id === b.dataset.id; })[0];
    sendOp(b.dataset.op, b.dataset.id, t ? (t.title || t.name) : ''); return;
  }
  var a = b.dataset.act;
  if (a === 'next') { secIdx++; render(); }
  else if (a === 'add') { $('#sheet-add').classList.add('open'); setTimeout(function () { $('#newt').focus(); }, 50); }
  else if (a === 'send-add') { var v = $('#newt').value.trim(); if (v) { sendOp('add', '', v); } }
  else if (a === 'settings') $('#sheet-set').classList.add('open');
  else if (a === 'save-tok') { var tk = $('#tok').value.trim(); if (/^github_pat_[A-Za-z0-9_]+$/.test(tk)) { lsSet('cdv2_tok', tk); toast('保存しました'); render(); flush(); } else toast('github_pat_ で始まる文字列を入れてください'); }
  else if (a === 'clear-tok') { lsSet('cdv2_tok', null); render(); }
  else if (a === 'lock') { lsSet('cdv2_pw', null); DATA = null; showLock(''); }
});

function start(d) {
  DATA = d;
  try { PEND = JSON.parse(lsGet('cdv2_pend') || '[]'); } catch (e) { PEND = []; }
  var ap = d.applied || [], cut = Date.now() - 3 * 864e5;
  PEND = PEND.filter(function (o) { return ap.indexOf(o.opId) < 0 && o.ts > cut; }); savePend();
  render(); flush();
}
var saved = lsGet('cdv2_pw');
if (saved) unlock(saved).then(start).catch(function () { lsSet('cdv2_pw', null); showLock('パスワードが変わりました。もう一度入力してください'); }); else showLock('');
</script>
</body>
</html>
